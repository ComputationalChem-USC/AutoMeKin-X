# Generated from the input-file pages: one entry per documented keyword.
- keyword: "molecule"
  syntax: "molecule value"
  section: "General"
  info: "<code>value</code> is one string with no blank spaces; _mandatory keyword_"
  desc: "<code>value</code> is the name of the system and _it must match the name of the XYZ file without the extension, FA in our example_."
  url: "/docs/general.html#kw-molecule"
- keyword: "LowLevel"
  syntax: "LowLevel values"
  section: "General"
  info: "two <code>values</code>: two strings; the second string accepts blank spaces; default: <code>mopac pm7</code>"
  desc: "The first <code>value</code> is the program and the second the semiempirical method."
  url: "/docs/general.html#kw-lowlevel"
- keyword: "HighLevel"
  syntax: "HighLevel values"
  section: "General"
  info: "two <code>values</code>: two strings; no blank spaces in each string; _mandatory keyword except for association_"
  desc: "The first <code>value</code> is the program (<code>g09</code>, <code>g16</code>, <code>orca</code>, <code>qcore</code> or <code>mlip</code>) and the second indicates the level of theory employed in the high-level calculations, or the model name for <code>mlip</code> (<code>uma</code> or <code>mace</code>)."
  url: "/docs/general.html#kw-highlevel"
- keyword: "HL_rxn_network"
  syntax: "HL_rxn_network value(s)"
  section: "General"
  info: "one or two <code>values</code>: first is a string, and second, if present, is an integer; default value: <code>reduced</code>"
  desc: "The first value can be <code>complete</code> or <code>reduced</code>."
  url: "/docs/general.html#kw-hl-rxn-network"
- keyword: "IRCpoints"
  syntax: "IRCpoints value"
  section: "General"
  info: "<code>value</code> is an integer; default value: <code>100</code> for g09/g16 and mlip, <code>500</code> for qcore and <code>20</code> for orca"
  desc: "<code>value</code> is the maximum number of IRC points in each direction computed at the high-level."
  url: "/docs/general.html#kw-ircpoints"
- keyword: "charge"
  syntax: "charge value"
  section: "General"
  info: "<code>value</code> is an integer; default value: <code>0</code> "
  desc: "<code>value</code> is the charge of the system."
  url: "/docs/general.html#kw-charge"
- keyword: "Memory"
  syntax: "Memory value"
  section: "General"
  info: "<code>value</code> is an integer; default value: <code>1</code> "
  desc: "<code>value</code> is the number of GB of memory employed in the gaussian high-level calculations."
  url: "/docs/general.html#kw-memory"
- keyword: "mult"
  syntax: "mult value"
  section: "General"
  info: "<code>value</code> is an integer; default value: <code>1</code> "
  desc: "<code>value</code> is the multiplicity of the system."
  url: "/docs/general.html#kw-mult"
- keyword: "timeout"
  syntax: "timeout value"
  section: "General"
  info: "<code>value</code> is an integer; default value: <code>1000000</code> "
  desc: "<code>value</code> is the maximum time, in seconds, allowed for a parallel job to complete."
  url: "/docs/general.html#kw-timeout"
- keyword: "sampling"
  syntax: "sampling value"
  section: "Method"
  info: "<code>value</code> is one string with no blank spaces; default value: <code>MD</code>"
  desc: "<code>value</code> can be: <code>MD</code>, <code>MD-micro</code>, <code>BXDE</code>, <code>external</code>, <code>ChemKnow</code>, <code>association</code> and <code>vdW</code>"
  url: "/docs/method.html#kw-sampling"
- keyword: "barrierless"
  syntax: "barrierless value"
  section: "Method"
  info: "<code>value</code> is one string: <code>yes</code> or <code>no</code>; default value: <code>no</code>"
  desc: "<code>value</code> can be <code>yes</code>, in which case barrierless processes are searched."
  url: "/docs/method.html#kw-barrierless"
- keyword: "MaxBO"
  syntax: "MaxBO value"
  section: "Method"
  info: "<code>value</code> is a number; __also for <code>ChemKnow</code>__;default value: <code>1.5</code>"
  desc: "MaxBO sets the maximum bond order value for a bond to be susceptible to breakage."
  url: "/docs/method.html#kw-maxbo"
- keyword: "neighbors"
  syntax: "neighbors values"
  section: "Method"
  info: "three <code>values</code>: first is a string and last two are floats; __also for <code>ChemKnow</code>__; default values, see table below"
  desc: "The first <code>value</code> is an atomic symbol and the two numbers are the minimum and maximum number of neighbors of the corresponding atoms."
  url: "/docs/method.html#kw-neighbors"
- keyword: "ntraj"
  syntax: "ntraj value"
  section: "Method"
  info: "<code>value</code> is an integer; default value: <code>1</code> "
  desc: "<code>value</code> is the number of trajectories."
  url: "/docs/method.html#kw-ntraj"
- keyword: "seed"
  syntax: "seed value"
  section: "Method"
  info: "<code>value</code> is an integer; __only for <code>MD</code> and <code>MD-micro</code>__ ; default value: <code>0</code> "
  desc: "<code>value</code> is the seed of the random number generator."
  url: "/docs/method.html#kw-seed"
- keyword: "Friction"
  syntax: "Friction value"
  section: "Method"
  info: "<code>value</code> is a float; default value: <code>0.5</code>"
  desc: "<code>value</code> is the friction coefficient in a.u."
  url: "/docs/method.html#kw-friction"
- keyword: "AdaptiveLimit"
  syntax: "AdaptiveLimit value"
  section: "Method"
  info: "<code>value</code> is an integer; default value: <code>100</code> "
  desc: "<code>value</code> determines how many MD steps are performed in a new box before the BXDE algorithm adaptively places a new box based upon the sampled energies."
  url: "/docs/method.html#kw-adaptivelimit"
- keyword: "Window"
  syntax: "Window value"
  section: "Method"
  info: "<code>value</code> is an integer; default value: <code>500</code> "
  desc: "<code>value</code> determines the number of consecutive MD steps before considering a reaction to have occurred."
  url: "/docs/method.html#kw-window"
- keyword: "Hookean"
  syntax: "Hookean values"
  section: "Method"
  info: "four <code>values</code>: first (`i`) and second (`j`) are integers, third (`rt`) and fourth (`k`) are floats"
  desc: "<code>Hookean</code> keyword can be employed with any BXDE-based dynamics sampling."
  url: "/docs/method.html#kw-hookean"
- keyword: "Graphto3D"
  syntax: "Graphto3D value"
  section: "Method"
  info: "<code>value</code> is a string: <code>POpt</code> or <code>Traj</code>; default value: <code>POpt</code>"
  desc: "<code>value</code> is the method employed to transform the product Graph into a 3D geometry."
  url: "/docs/method.html#kw-graphto3d"
- keyword: "active"
  syntax: "active values"
  section: "Method"
  info: "<code>values</code> are integers"
  desc: "<code>values</code> are the labels of the atoms that participate in the reactions we are interested in."
  url: "/docs/method.html#kw-active"
- keyword: "startd"
  syntax: "startd value"
  section: "Method"
  info: "<code>value</code> is a float; default value: <code>2.75</code>"
  desc: "<code>value</code> is the maximum distance between active atoms to be considered in a bond formation."
  url: "/docs/method.html#kw-startd"
- keyword: "MaxBoF/MaxBoB"
  syntax: "MaxBoF/MaxBoB value"
  section: "Method"
  info: "<code>value</code> is an integer; default value: <code>2</code>"
  desc: "<code>value</code> is the maximum number of bonds formed (n<sub>F</sub>)/broken (n<sub>B</sub>) to make all possible (n<sub>F</sub>,n<sub>B</sub>) combinations for Graph transformations."
  url: "/docs/method.html#kw-maxbof-maxbob"
- keyword: "comb22"
  syntax: "comb22 value"
  section: "Method"
  info: "<code>value</code> is a string: <code>yes</code> or <code>no</code>; default value: <code>no</code>"
  desc: "By default, the $\\scriptstyle{(}$2,2$\\scriptstyle{)}$ combination is not considered."
  url: "/docs/method.html#kw-comb22"
- keyword: "crossb"
  syntax: "crossb value"
  section: "Method"
  info: "<code>value</code> is a string: <code>yes</code> or <code>no</code>; default value: <code>no</code>"
  desc: "A check can be done to see if the closest distance between the paths followed by the atoms in their rearrangements is lower that a threshold value, a potential problem in planar molecules or planar regions of a molecule."
  url: "/docs/method.html#kw-crossb"
- keyword: "BreakRing"
  syntax: "BreakRing value"
  section: "Method"
  info: "<code>value</code> is a string: <code>yes</code> or <code>no</code>; default value: <code>no</code>"
  desc: "By default, a bond that belongs to a ring is not broken in $\\scriptstyle{(}$0,1$\\scriptstyle{)}$ transformations."
  url: "/docs/method.html#kw-breakring"
- keyword: "CK_minima"
  syntax: "CK_minima value"
  section: "Method"
  info: "<code>value</code> is a string: <code>all</code> or <code>cg</code>; default value: <code>all</code>"
  desc: "By default, all minima are used for graph transformations including conformers."
  url: "/docs/method.html#kw-ck-minima"
- keyword: "imagmin"
  syntax: "imagmin value"
  section: "Screening"
  info: "`value` is an integer; default value: `0` "
  desc: "`value` is the minimum value for the imaginary frequency (in absolute value and cm<sup>−1</sup>) of the selected TS structures."
  url: "/docs/screening.html#kw-imagmin"
- keyword: "MAPEmax"
  syntax: "MAPEmax value"
  section: "Screening"
  info: "`value` is a float; default value: `0` "
  desc: "`value` is the maximum value for MAPE."
  url: "/docs/screening.html#kw-mapemax"
- keyword: "BAPEmax"
  syntax: "BAPEmax value"
  section: "Screening"
  info: "`value` is a float; default value: `0` "
  desc: "`value` is the maximum value for BAPE."
  url: "/docs/screening.html#kw-bapemax"
- keyword: "eigLmax"
  syntax: "eigLmax value"
  section: "Screening"
  info: "`value` is a float; default value: `0`"
  desc: "`value` is the maximum value for an eigL to be considered 0."
  url: "/docs/screening.html#kw-eiglmax"
- keyword: "Energy"
  syntax: "Energy value"
  section: "Kinetics"
  info: "`value` is an integer; default value: `0` "
  desc: "`value` is the energy in kcal/mol for which microcanonical rate coefficients will be calculated."
  url: "/docs/kinetics.html#kw-energy"
- keyword: "Temperature"
  syntax: "Temperature value"
  section: "Kinetics"
  info: "`value` is an integer; default value: `298`"
  desc: "`value` is the temperature in K for which thermal rate coefficients will be calculated."
  url: "/docs/kinetics.html#kw-temperature"
- keyword: "iop"
  syntax: "iop value"
  section: "General (advanced)"
  info: "`value` is one string with no blank spaces; no default value"
  desc: "`value` is a gaussian IOp string or any other additional keyword you want to add."
  url: "/docs/advanced_options.html#kw-iop"
- keyword: "LowLevel_TSopt"
  syntax: "LowLevel_TSopt values"
  section: "General (advanced)"
  info: "two `values`: two strings; no blank spaces in each string; default values: `mopac value[LowLevel]`"
  desc: "First `value` is the program (`mopac`, `qcore`, `g09`, `g16`, `orca` or `mlip`) and second value is the electronic structure level employed to optimize the TSs at the low-level stage, or the model name (`uma` or `mace`) for `mlip`."
  url: "/docs/advanced_options.html#kw-lowlevel-tsopt"
- keyword: "LowLevel_IRC"
  syntax: "LowLevel_IRC values"
  section: "General (advanced)"
  info: "two `values`: two strings; default value: the program of `LowLevel_TSopt`"
  desc: "Program and model employed for the low-level IRC calculations and minima optimizations, once the TSs have been located."
  url: "/docs/advanced_options.html#kw-lowlevel-irc"
- keyword: "recalc"
  syntax: "recalc value"
  section: "General (advanced)"
  info: "one `value`: one integer; by default this keyword is not employed; _only with mopac_ "
  desc: "If the last point of the IRC is an intermediate, MOPAC will try to optimize it."
  url: "/docs/advanced_options.html#kw-recalc"
- keyword: "atoms"
  syntax: "atoms value(s)"
  section: "Method (advanced)"
  info: "one or two `values`: first is a string with no blank spaces or an integer and second, if present, is a string with no blank spaces; _only with MD_ ; default value: `all`"
  desc: "The first `value` can be `all`, in which case no other values are needed, or the number of atoms initially excited followed by a second value, a string, which is the list of atoms separated by commas, without blank spaces."
  url: "/docs/advanced_options.html#kw-atoms"
- keyword: "etraj"
  syntax: "etraj value"
  section: "Method (advanced)"
  info: "`value` is an integer or string with no blank spaces; _only with MD-micro_ ; no default"
  desc: "If an integer, `value` is the energy, in kcal/mol, of the MD-micro simulations."
  url: "/docs/advanced_options.html#kw-etraj"
- keyword: "factorflipv"
  syntax: "factorflipv value"
  section: "Method (advanced)"
  info: "`value` is a float; _only with MD and MD-micro_ ; no default"
  desc: "Using the default options, trajectories are halted when the simulation time reaches the `value[fs]`, see below, or when there an interatomic distance, $\\scriptstyle{r_{ij}}$, reaches 5 times its initial value $\\scriptstyle{r_{ij}^0}$, which is regarded as a fragmentation."
  url: "/docs/advanced_options.html#kw-factorflipv"
- keyword: "fs"
  syntax: "fs value"
  section: "Method (advanced)"
  info: "`value` is an integer; default value: `500` for MD and MD-micro and `5000` for BXDE"
  desc: "`value` is the simulation time in fs in MD, MD-micro and BXDE samplings."
  url: "/docs/advanced_options.html#kw-fs"
- keyword: "modes"
  syntax: "modes value(s)"
  section: "Method (advanced)"
  info: "one or two `values`: first is a string with no blank spaces or an integer and second, if present, is a string with no blank spaces; _only with MD-micro_ ; default value: `all`"
  desc: "The first `value` can be `all`, in which case no other values are needed, or the number of modes initially excited followed by a second value, string, which is the list of modes separated by commas and without blank spaces."
  url: "/docs/advanced_options.html#kw-modes"
- keyword: "multiple_minima"
  syntax: "multiple_minima value"
  section: "Method (advanced)"
  info: "`value` is one string: `yes` or `no`; default value: `yes`"
  desc: "`value` can be `yes`, in which case the exploratory simulations start from multiple minima, or `no`, where the all the MD simulations start from the input initial structure."
  url: "/docs/advanced_options.html#kw-multiple-minima"
- keyword: "post_proc"
  syntax: "post_proc value(s)"
  section: "Method (advanced)"
  info: "from one to three `values`: first `value` is a string: `bbfs`, `bots` or `no`; the second and third are integers or floats; default values: `bbfs 20 1` for all samplings except association where the default value is `no`"
  desc: "The first `value` is the post-processing algorithm employed to detect reaction events and it can be bbfs, the default, `bots` or `no`, if no algorithm is applied; this makes only sense for the purpose of testing the MD module."
  url: "/docs/advanced_options.html#kw-post-proc"
- keyword: "temp"
  syntax: "temp value"
  section: "Method (advanced)"
  info: "`value` is an integer or string with no blank spaces; _only with MD and BXDE_ ; no default"
  desc: "If an integer, `value` is the temperature, in K, of the MD or BXDE simulations."
  url: "/docs/advanced_options.html#kw-temp"
- keyword: "thmass"
  syntax: "thmass value"
  section: "Method (advanced)"
  info: "`value` is an integer; _only with MD_ ; default value: `0`"
  desc: "`value` is the required minimum mass in a.u."
  url: "/docs/advanced_options.html#kw-thmass"
- keyword: "Use_LET"
  syntax: "Use_LET value"
  section: "Method (advanced)"
  info: "`value` is one string: `yes` or `no`; _only with mopac_ ; default value: `no` for all samplings except `ChemKnow`"
  desc: "If `value` is `yes`, then mopac TS optimizations that fail throwing the error: “NUMERICAL PROBLEMS BRACKETING LAMDA” are rerun using LET keyword, which allows [more of the potential energy surface to be sampled:](http://openmopac.net/manual/error_messages.html)_."
  url: "/docs/advanced_options.html#kw-use-let"
- keyword: "tight_ts"
  syntax: "tight_ts value"
  section: "Screening (advanced)"
  info: "`value` is one string: `yes` or `no`; default value: `yes`"
  desc: "`value` can be `yes`, in which case only first order saddles are considered, or `no` if we want to keep also higher order saddles."
  url: "/docs/advanced_options.html#kw-tight-ts"
- keyword: "imin"
  syntax: "imin value"
  section: "Kinetics (advanced)"
  info: "`value` is an integer or the string `min0`; default value: `min0`"
  desc: "`value` is the starting minimum for the KMC simulations."
  url: "/docs/advanced_options.html#kw-imin"
- keyword: "nmol"
  syntax: "nmol value"
  section: "Kinetics (advanced)"
  info: "`value` is an integer; default value: `1000` "
  desc: "`value` is the number of molecules for the KMC simulations."
  url: "/docs/advanced_options.html#kw-nmol"
- keyword: "Stepsize"
  syntax: "Stepsize value"
  section: "Kinetics (advanced)"
  info: "`value` is an integer; default value: `10` "
  desc: "`value` is the number of reactions that have to take place before printing the population in the KMC runs."
  url: "/docs/advanced_options.html#kw-stepsize"
- keyword: "MaxEn"
  syntax: "MaxEn value"
  section: "Kinetics (advanced)"
  info: "`value` is an integer; default value: `100` for thermal kinetics or 3/2 the value of Energy for microcanonical kinetics"
  desc: "`value` is the maximum allowed energy, in kcal/mol and relative to the input structure, for a TS to be included in the reaction network."
  url: "/docs/advanced_options.html#kw-maxen"
- keyword: "ImpPaths"
  syntax: "ImpPaths value"
  section: "Kinetics (advanced)"
  info: "`value` is a float; default value: `0` "
  desc: "`value` is the minimum percentage of processes occurring through a particular pathway that has to be achieved in order to be considered relevant and finally included in `RXNet.rel`."
  url: "/docs/advanced_options.html#kw-imppaths"
- keyword: "nbondsfrozen"
  syntax: "nbondsfrozen value"
  section: "Biased dynamics"
  info: "`value` is an integer; default value: `0` "
  desc: "where `value`, or `nfr`, is the number of constrained bonds."
  url: "/docs/biased.html#kw-nbondsfrozen"
- keyword: "nbondsbreak"
  syntax: "nbondsbreak value"
  section: "Biased dynamics"
  info: "`value` is an integer; default value: `0` "
  desc: "where `value`, or `nbr`, is the number of bonds we want to break."
  url: "/docs/biased.html#kw-nbondsbreak"
- keyword: "fragmentA"
  syntax: "fragmentA value"
  section: "vdW"
  info: "`value` is one string with no blank spaces; _mandatory keyword_ "
  desc: "`value` is the name of fragment A (`Bz` in our case)."
  url: "/docs/vdw.html#kw-fragmenta"
- keyword: "fragmentB"
  syntax: "fragmentB value"
  section: "vdW"
  info: "`value  is one string with no blank spaces; _mandatory keyword`_ "
  desc: "`value` is the name of fragment B (`N2` in our case)."
  url: "/docs/vdw.html#kw-fragmentb"
- keyword: "rotate"
  syntax: "rotate values"
  section: "vdW"
  info: "four `values`: first two can be strings or integers and last two are floats; default values: `com com 4.0 1.5`"
  desc: "The first two values are the pivot positions of the random rotations: the center of mass (`com`) of fragment A and the center of mass of fragment B in our example; these pivots could be labels of atoms and therefore integers."
  url: "/docs/vdw.html#kw-rotate"
- keyword: "Nassoc"
  syntax: "Nassoc value"
  section: "vdW"
  info: "`value` is an integer; default value: `100` "
  desc: "`value` is the total number of intermolecular structures considered in the sampling."
  url: "/docs/vdw.html#kw-nassoc"
- keyword: "ntorstasks"
  syntax: "ntorstasks value"
  section: "Dihedral scans"
  info: "`value` is an integer; default value: `1`"
  desc: "`value` is the number of parallel tasks that share the torsional scan in each iteration of `llcalcs.sh`/`amk_parallel.sh`_."
  url: "/docs/dihedral.html#kw-ntorstasks"
- keyword: "minsize"
  syntax: "minsize value"
  section: "Fragmentation"
  info: "`value` is an integer; default value: `4` "
  desc: "`value` is the minimum number of atoms for a fragment to be considered in secondary fragmentations."
  url: "/docs/fragmentation.html#kw-minsize"
- keyword: "systems"
  syntax: "systems value"
  section: "Fragmentation"
  info: "`value` is an integer; default value: `0`"
  desc: "`value` (or `ns`) is the number of additional fragments, or systems, to be considered in secondary fragmentations, besides those obtained in the fragmentation of the parent molecule."
  url: "/docs/fragmentation.html#kw-systems"
