name: amk_env
channels:
  - entos
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - qcore=0.8.14
  - parallel
  - lmod
  - networkx
  - gxx
  - gawk
  - gfortran
  - libgfortran
  - tar
  - git
  - make
  - autoconf
  - automake
  - cmake
  - patchelf
  - ase
  - matplotlib
  - sqlite
  - bc
  - curl
  - pillow
  - joblib
  - tbb[version='<2021']
  - pip
  - pip:
      # Reaction-network visualization and statistics (amk_gen_view.py, amk_rxn_stats.py)
      - git+https://github.com/ComputationalChem-USC/amk_tools_X.git
      # MLIP backend (HighLevel mlip uma/mace) -- installed via pip to avoid
      # disturbing the conda solve (qcore/entos pins tbb<2021 above)
      - torch
      - sella
      - omegaconf
      - mace-torch
      - fairchem-core

