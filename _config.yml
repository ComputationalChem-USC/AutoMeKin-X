title: AutoMeKin-X
description: Documentation for AutoMeKin-X, automated reaction discovery
theme: just-the-docs

aux_links:
  GitHub: https://github.com/ComputationalChem-USC/AutoMeKin-X

# External navigation links
nav_external_links:
  - title: Network visualization tools
    url: https://github.com/dgarayr/amk_tools
  - title: Try it on the Web
    url: https://rxnkin.usc.es/amk/
  - title: Open in Colab
    url: https://colab.research.google.com/github/ComputationalChem-USC/AutoMeKin-X/blob/main/notebooks/AutoMeKin.ipynb

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2026 Emilio Martinez-Nunez"

# Color scheme currently only supports "dark", "light"/nil (default), or a custom scheme that you define
color_scheme: automekin
    
callouts_level: quiet # or loud
callouts:
  highlight:
    color: blue
  important:
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: grey-dk
  warning:
    title: Warning
    color: red

kramdown:
  input: GFM
  math_engine: mathjax # you can also set this field to 'katex'
